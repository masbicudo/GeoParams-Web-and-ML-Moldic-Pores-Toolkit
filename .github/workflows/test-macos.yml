name: Test portable shell launchers

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shell test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt dash bats

      - name: Lint and check formatting
        run: |
          shellcheck -x GeoParams.sh GeoParams.command scripts/*.sh \
            scripts/lib/*.sh geo_params_web/run.sh \
            tests/shell/test-launchers.sh
          shfmt -d -i 4 -ci GeoParams.sh GeoParams.command scripts/*.sh \
            scripts/lib/*.sh geo_params_web/run.sh \
            tests/shell/test-launchers.sh

      - name: Test with Bash and Dash
        run: |
          bash -n GeoParams.sh GeoParams.command scripts/*.sh \
            scripts/lib/*.sh geo_params_web/run.sh
          dash -n GeoParams.sh GeoParams.command scripts/*.sh \
            scripts/lib/*.sh geo_params_web/run.sh
          bash tests/shell/test-launchers.sh bash
          dash tests/shell/test-launchers.sh dash
          bats tests/shell/launchers.bats

      - name: Test dataset verification logic
        run: python3 -m unittest tests.test_dataset_manager -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Open and leave the Windows manager
        shell: cmd
        run: (echo q)|GeoParams.bat

      - name: Test dataset verification logic
        run: python -m unittest tests.test_dataset_manager -v

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Show environment
        run: |
          sw_vers
          uname -a
          bash --version
          zsh --version

      - name: Test portable launchers
        run: |
          chmod +x GeoParams.sh GeoParams.command scripts/*.sh
          chmod +x scripts/lib/*.sh geo_params_web/run.sh
          chmod +x tests/shell/test-launchers.sh
          sh -n GeoParams.sh GeoParams.command scripts/*.sh \
            scripts/lib/*.sh geo_params_web/run.sh
          bash -n GeoParams.sh GeoParams.command scripts/*.sh \
            scripts/lib/*.sh geo_params_web/run.sh
          sh tests/shell/test-launchers.sh sh
          bash tests/shell/test-launchers.sh bash
