x-project-labels: &project-labels
  io.geoparams.project: geo-params-web
  io.geoparams.managed-by: geo-params-launcher

services:
  dataset-manager:
    image: ${GEO_PARAMS_DATASET_IMAGE:-geo-params-datasets:app-v2}
    build:
      context: ..
      dockerfile: scripts/Dockerfile.datasets
    environment:
      HOME: /tmp
    labels: *project-labels
    user: "${GEO_PARAMS_UID:-0}:${GEO_PARAMS_GID:-0}"
    volumes:
      - ../datasets:/datasets

  prepare:
    image: ${GEO_PARAMS_IMAGE:-geo-params-web-app:app-v2}
    command: ["pdm", "run", "python", "prepare_web_images.py"]
    labels: *project-labels
    volumes:
      - ${GEO_PARAMS_DATASETS_DIR:-../datasets}:/workspace/datasets:ro
      - ./static/imgs_sections:/workspace/geo_params_web/static/imgs_sections

  app:
    image: ${GEO_PARAMS_IMAGE:-geo-params-web-app:app-v2}
    build:
      context: ..
      dockerfile: geo_params_web/Dockerfile
    environment:
      FLASK_ENV: production
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-geo-params-local-development}
      GEO_PARAMS_UPLOADS_DIR: /workspace/geo_params_web/data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-1024}
      POROSITY_BOOTSTRAP_REPLICATES: ${POROSITY_BOOTSTRAP_REPLICATES:-200}
    labels: *project-labels
    expose:
      - "5000"
      - "8501"
    restart: unless-stopped
    volumes:
      - ./static/imgs_sections:/workspace/geo_params_web/static/imgs_sections:ro
      - ./static/output:/workspace/geo_params_web/static/output
      - ./data/uploads:/workspace/geo_params_web/data/uploads
      - ./log:/workspace/geo_params_web/log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:5000/", timeout=5);
          urllib.request.urlopen("http://127.0.0.1:8501/geo-server/stats/_stcore/health", timeout=5)
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${GEO_PARAMS_PORT:-8181}:80"
    labels: *project-labels
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  default:
    labels: *project-labels
